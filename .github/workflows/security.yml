name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m bandit -r plugins/1000x-engineer/skills/1000x-engineer/scripts -ll
      - run: python -m pip_audit .
      - run: python -m pytest tests/test_path_security.py tests/test_markdown_safety.py
