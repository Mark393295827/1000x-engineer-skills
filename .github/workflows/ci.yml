name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m mypy plugins/1000x-engineer/skills/1000x-engineer/scripts scripts tests
      - run: python scripts/sync_compatibility_mirrors.py --check
      - run: python plugins/1000x-engineer/skills/1000x-engineer/scripts/validate_contract.py plugins/1000x-engineer/skills/1000x-engineer/resources/task-contract.example.json
      - run: python plugins/1000x-engineer/skills/1000x-engineer/scripts/validate_skill.py plugins/1000x-engineer/skills/1000x-engineer
      - run: python scripts/validate_plugin.py plugins/1000x-engineer
